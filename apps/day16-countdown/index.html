<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>カウントダウン</title>
  <meta name="description" content="複数イベントのカウントダウンツール。誕生日・旅行・締切などを管理。">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="カウントダウン">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
/* =============================================================
   カウントダウンアプリ - スタイルシート（クラシックテーマ）
   M PLUS Rounded 1c フォント使用
   CSS変数でダークモード対応
============================================================= */

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* === Classic warm color palette === */
  --color-primary:   #b45309;
  --color-primary-d: #92400e;
  --color-secondary: #d97706;
  --color-success:   #047857;
  --color-warning:   #d97706;
  --color-danger:    #b91c1c;
  --color-today:     #d97706;

  /* Light mode — warm cream */
  --bg:        #f5efe6;
  --bg-card:   #fffcf5;
  --bg-panel:  #fffcf5;
  --bg-input:  #fdf8f0;
  --border:    #ddc99a;
  --border-focus: #b45309;

  /* Text */
  --text:      #1c1208;
  --text-sub:  #78532a;
  --text-muted:#b08a5a;

  /* Shadow */
  --shadow-sm: 0 1px 4px rgba(100,60,0,.10);
  --shadow-md: 0 4px 14px rgba(100,60,0,.13);
  --shadow-lg: 0 8px 28px rgba(100,60,0,.16);

  /* Flip clock */
  --flip-bg:      #1a1008;
  --flip-text:    #fcd34d;
  --flip-divider: rgba(252,211,77,.15);

  /* Radius */
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  /* Layout */
  --header-h: 54px;
  --panel-w:  300px;
  --tab-h:    42px;
}

/* ----- Dark Mode ----- */
html.dark {
  --bg:        #1a1208;
  --bg-card:   #2a1e0e;
  --bg-panel:  #2a1e0e;
  --bg-input:  #1a1208;
  --border:    #5a3e1e;
  --text:      #f5e6cc;
  --text-sub:  #c8a06a;
  --text-muted:#8a6040;
  --flip-bg:   #0e0a04;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

html, body {
  height: 100%;
  font-family: 'M PLUS Rounded 1c', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.app-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: #1c1208;
  border-bottom: 2px solid #b45309;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.header-left { display: flex; align-items: center; gap: 8px; }
.app-icon { font-size: 1.4rem; }
.app-title {
  font-size: 1.15rem; font-weight: 800;
  color: #fcd34d;
  letter-spacing: .03em;
}
.header-right { display: flex; align-items: center; gap: 8px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 7px 16px;
  border: 1.5px solid transparent;
  border-radius: var(--radius-md);
  font-family: inherit; font-size: .875rem; font-weight: 700;
  cursor: pointer; transition: filter .15s, transform .1s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }
.btn-primary  { background: var(--color-primary); color: #fff; border-color: var(--color-primary-d); }
.btn-secondary{ background: var(--border); color: var(--text); }
.btn-danger   { background: var(--color-danger); color: #fff; }

.icon-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(252,211,77,.3); border-radius: var(--radius-sm);
  background: rgba(255,255,255,.08); cursor: pointer;
  font-size: 1.05rem; transition: background .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.18); }

.icon-btn-sm {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 5px;
  background: transparent; cursor: pointer;
  font-size: .82rem; transition: background .15s;
  opacity: .55;
}
.icon-btn-sm:hover { background: var(--border); opacity: 1; }

/* ===== MAIN LAYOUT ===== */
.app-main {
  margin-top: var(--header-h);
  display: flex;
  height: calc(100svh - var(--header-h));
  overflow: hidden;
}

/* ===== EVENT PANEL (LEFT) ===== */
.event-panel {
  width: var(--panel-w);
  min-width: var(--panel-w);
  background: var(--bg-panel);
  border-right: 1.5px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--color-primary) 6%, var(--bg-panel));
}
.panel-title { font-size: .88rem; font-weight: 800; color: var(--color-primary); }
.sort-select {
  font-family: inherit; font-size: .73rem; font-weight: 500;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 3px 6px; cursor: pointer; outline: none;
}
.sort-select:focus { border-color: var(--border-focus); }

.event-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.event-list::-webkit-scrollbar { width: 4px; }
.event-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ===== EVENT LIST ITEM ===== */
.event-item {
  display: flex;
  align-items: stretch;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color .15s, background .15s, box-shadow .15s;
  overflow: hidden;
}
.event-item:hover { border-color: var(--color-primary); box-shadow: var(--shadow-sm); }
.event-item.selected {
  border-color: var(--color-primary);
  background: color-mix(in srgb, var(--color-primary) 8%, var(--bg-card));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-primary) 22%, transparent);
}
.event-item.is-past   { opacity: .65; }
.event-item.is-today  { border-color: var(--color-today); }
.event-item.is-urgent { border-color: var(--color-warning); }

.event-item-color { width: 5px; min-height: 58px; flex-shrink: 0; }
.event-item-body  { flex: 1; padding: 7px 6px 7px 8px; min-width: 0; }
.event-item-row1  { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 2px; }

.event-item-name {
  font-size: .83rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.event-item-badge {
  font-size: .68rem; font-weight: 700; white-space: nowrap;
  padding: 1px 6px; border-radius: 4px;
  background: color-mix(in srgb, var(--color-primary) 14%, transparent);
  color: var(--color-primary);
  flex-shrink: 0;
}
.event-item-badge.badge-today  { background: color-mix(in srgb, var(--color-today) 18%, transparent); color: var(--color-today); }
.event-item-badge.badge-urgent { background: color-mix(in srgb, var(--color-warning) 18%, transparent); color: var(--color-warning); }
.event-item-badge.badge-past   { background: color-mix(in srgb, var(--text-muted) 18%, transparent); color: var(--text-muted); }

.event-item-row2 { display: flex; align-items: center; gap: 6px; }
.event-item-date { font-size: .7rem; color: var(--text-sub); }
.event-item-cat  { font-size: .68rem; font-weight: 600; }
.event-item-memo { font-size: .7rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.event-item-actions { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 4px 4px 4px 0; }

.event-list-empty { text-align: center; color: var(--text-muted); font-size: .83rem; padding: 24px 8px; line-height: 1.8; }

/* ===== DISPLAY PANEL (RIGHT) ===== */
.display-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* ===== STYLE TABS ===== */
.style-tabs {
  display: flex;
  background: var(--bg-card);
  border-bottom: 1.5px solid var(--border);
  padding: 0 12px;
  gap: 0;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.style-tabs::-webkit-scrollbar { display: none; }
.style-tab {
  padding: 0 14px;
  height: var(--tab-h);
  border: none; background: transparent;
  font-family: inherit; font-size: .82rem; font-weight: 700;
  color: var(--text-muted); cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.style-tab:hover { color: var(--color-primary); }
.style-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

/* ===== NO EVENT MESSAGE ===== */
.no-event-msg {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--text-muted);
  padding: 32px;
}
.no-event-icon { font-size: 3rem; }
.no-event-msg p { font-size: 1rem; font-weight: 500; }

/* ===== COUNTDOWN DISPLAY ===== */
.countdown-display {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 14px;
  gap: 10px;
}

/* ===== EVENT INFO HEADER ===== */
.event-info-header {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.event-info-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.display-event-name { font-size: 1.2rem; font-weight: 800; }
.display-category { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.display-date  { font-size: .8rem; color: var(--text-sub); font-weight: 500; }
.display-memo  { font-size: .76rem; color: var(--text-muted); margin-top: 2px; }

/* ===== STYLE CONTENT (shared) ===== */
.style-content {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--border);
  padding: 24px 16px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  flex: 1;
  box-shadow: var(--shadow-sm);
}

/* ===== STATUS TEXT ===== */
.status-text {
  font-size: .84rem; font-weight: 700;
  color: var(--text-sub);
  text-align: center;
  min-height: 1.5em;
  padding: 5px 16px;
  border-radius: var(--radius-md);
  transition: background .3s;
}
.status-text.status-today  { color: var(--color-today);   background: color-mix(in srgb, var(--color-today) 12%, transparent); }
.status-text.status-urgent { color: var(--color-warning); background: color-mix(in srgb, var(--color-warning) 12%, transparent); }
.status-text.status-past   { color: var(--text-muted); }

/* ================================================
   STYLE 1: DIGITAL
================================================ */
.digital-grid {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.digital-card {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  min-width: 76px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.06), var(--shadow-sm);
  transition: border-color .3s;
}
.digital-card .digital-value {
  font-size: 3rem; font-weight: 900; line-height: 1;
  color: var(--color-primary);
  font-variant-numeric: tabular-nums;
  transition: color .3s;
  letter-spacing: -0.03em;
}
.digital-card .digital-label {
  font-size: .7rem; font-weight: 700;
  color: var(--text-muted); margin-top: 5px;
  letter-spacing: .05em;
}
.digital-sep {
  font-size: 2.2rem; font-weight: 900; color: var(--border);
  align-self: flex-start; padding-top: 8px;
}

.digital-grid.is-today  .digital-value { color: var(--color-today); }
.digital-grid.is-urgent .digital-value { color: var(--color-warning); }
.digital-grid.is-past   .digital-value { color: var(--text-muted); }
.digital-grid.is-today  .digital-card,
.digital-grid.is-urgent .digital-card  { border-color: var(--color-warning); }

/* ================================================
   STYLE 2: RING
================================================ */
.ring-wrapper { display: flex; justify-content: center; }
.ring-container { position: relative; display: inline-block; }
.ring-svg {
  width: clamp(200px, 50vw, 260px);
  height: clamp(200px, 50vw, 260px);
  overflow: visible;
}
.ring-track { fill: none; stroke: var(--border); stroke-width: 14; }
.ring-track-inner { stroke-width: 10; }
.ring-progress {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 14;
  stroke-linecap: round;
  transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1), stroke .3s;
}
.ring-sec-progress { stroke: var(--color-secondary); stroke-width: 10; }
.ring-progress.is-today  { stroke: var(--color-today); }
.ring-progress.is-urgent { stroke: var(--color-warning); }
.ring-progress.is-past   { stroke: var(--text-muted); }

.ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.ring-main-value { font-size: 2.8rem; font-weight: 900; line-height: 1; color: var(--color-primary); }
.ring-main-label { font-size: .78rem; font-weight: 700; color: var(--text-muted); }
.ring-sub-value  { font-size: .88rem; font-weight: 700; color: var(--text-sub); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* ================================================
   STYLE 3: ANALOG
================================================ */
.analog-wrapper { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.analog-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.analog-svg {
  width: clamp(180px, 45vw, 240px);
  height: clamp(180px, 45vw, 240px);
  filter: drop-shadow(0 4px 14px rgba(100,60,0,.18));
}
.analog-face   { fill: var(--bg-card); }
.analog-border { fill: none; stroke: var(--border); stroke-width: 2; }
.analog-mark   { stroke: var(--text-muted); stroke-width: 1.5; }
.analog-mark-major { stroke: var(--color-primary); stroke-width: 2.5; }

.analog-hand { fill: none; }
.analog-day-hand  { stroke: var(--color-primary); stroke-width: 5; }
.analog-hour-hand { stroke: var(--color-secondary); stroke-width: 3.5; }
.analog-min-hand  { stroke: var(--color-success); stroke-width: 2; }

.analog-center     { fill: var(--bg-card); stroke: var(--color-primary); stroke-width: 2; }
.analog-center-dot { fill: var(--color-primary); }

.analog-legend { display: flex; gap: 12px; }
.analog-legend-item { display: flex; align-items: center; gap: 4px; font-size: .73rem; color: var(--text-sub); }
.analog-legend-dot  { width: 12px; height: 4px; border-radius: 2px; }
.analog-legend-day  { background: var(--color-primary); height: 5px; }
.analog-legend-hour { background: var(--color-secondary); height: 3px; }
.analog-legend-min  { background: var(--color-success); height: 2px; }

.analog-info { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.analog-info-item {
  display: flex; flex-direction: column; align-items: center;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 14px; min-width: 60px;
  box-shadow: var(--shadow-sm);
}
.analog-info-value { font-size: 1.6rem; font-weight: 900; color: var(--color-primary); font-variant-numeric: tabular-nums; line-height: 1; }
.analog-info-label { font-size: .68rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }

/* ================================================
   STYLE 4: BAR
================================================ */
.bar-container { width: 100%; max-width: 540px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.bar-main-value  { font-size: 2.8rem; font-weight: 900; color: var(--color-primary); line-height: 1; }
.bar-time-value  { font-size: 1.1rem; font-weight: 700; color: var(--text-sub); font-variant-numeric: tabular-nums; }
.bar-progress-wrap { width: 100%; }
.bar-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .73rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;
}
.bar-percent { color: var(--color-primary); font-size: .84rem; }

.bar-track {
  width: 100%; height: 18px;
  background: var(--bg);
  border-radius: 4px;
  border: 1.5px solid var(--border);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
  border-radius: 4px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
.bar-fill.is-today  { background: linear-gradient(90deg, var(--color-today), #fb923c); }
.bar-fill.is-urgent { background: linear-gradient(90deg, var(--color-warning), #fb923c); }
.bar-fill.is-past   { background: var(--text-muted); }

.bar-date-labels { display: flex; justify-content: space-between; font-size: .68rem; color: var(--text-muted); margin-top: 4px; }

.bar-sub-grid { display: flex; gap: 8px; justify-content: center; width: 100%; }
.bar-sub-item {
  flex: 1; max-width: 80px;
  display: flex; flex-direction: column; align-items: center;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-md); padding: 8px;
  box-shadow: var(--shadow-sm);
}
.bar-sub-value { font-size: 1.5rem; font-weight: 900; color: var(--color-primary); line-height: 1; font-variant-numeric: tabular-nums; }
.bar-sub-label { font-size: .68rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }

/* ================================================
   STYLE 5: FLIP CLOCK — クラシックパタパタ時計
================================================ */
.flip-container {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.flip-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.flip-label { font-size: .7rem; font-weight: 700; color: var(--text-muted); letter-spacing: .05em; }
.flip-separator {
  font-size: 2.8rem; font-weight: 900;
  color: #5a3e1e;
  align-self: flex-start; padding-top: 4px; margin: 0 -3px;
}

.flip-unit {
  position: relative;
  width: 76px;
  height: 92px;
  perspective: 500px;
  perspective-origin: center center;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
}

/* Static halves */
.flip-top,
.flip-bottom {
  position: absolute;
  width: 100%;
  height: 50%;
  overflow: hidden;
  background: var(--flip-bg);
}
.flip-top {
  top: 0;
  border-radius: 8px 8px 0 0;
  border-bottom: 1.5px solid var(--flip-divider);
  background: linear-gradient(180deg, #2a1c0a 0%, var(--flip-bg) 100%);
}
.flip-bottom {
  bottom: 0;
  border-radius: 0 0 8px 8px;
  background: linear-gradient(180deg, var(--flip-bg) 0%, #0e0905 100%);
}

/* 数字テキスト — position:absolute で正確にクリッピング */
.flip-top span,
.flip-bottom span,
.flip-anim-top span,
.flip-anim-bottom span {
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--flip-text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  text-shadow: 0 0 12px rgba(252,211,77,.5);
}

.flip-top span {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flip-bottom span {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* アニメーション オーバーレイ — 非アニメーション時は非表示 */
.flip-anim-top,
.flip-anim-bottom {
  position: absolute;
  width: 100%;
  height: 50%;
  overflow: hidden;
  background: var(--flip-bg);
  z-index: 10;
  pointer-events: none;
  opacity: 0;
}
.flip-anim-top {
  top: 0;
  border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #2a1c0a 0%, var(--flip-bg) 100%);
  transform-origin: center bottom;
  transform: rotateX(0deg);
}
.flip-anim-top span {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flip-anim-bottom {
  bottom: 0;
  border-radius: 0 0 8px 8px;
  background: linear-gradient(180deg, var(--flip-bg) 0%, #0e0905 100%);
  transform-origin: center top;
  transform: rotateX(90deg);
}
.flip-anim-bottom span {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 200%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flip-anim-top.flipping-top {
  opacity: 1;
  animation: flipTopAway .28s ease-in forwards;
}
.flip-anim-bottom.flipping-bottom {
  opacity: 1;
  animation: flipBottomIn .28s ease-out .28s forwards;
}

@keyframes flipTopAway {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}
@keyframes flipBottomIn {
  0%   { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}

/* ================================================
   MODAL
================================================ */
.modal {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 16px;
}
.modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
}
.modal-content {
  position: relative; z-index: 1;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  border: 1.5px solid var(--border);
  padding: 0;
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow-lg);
  animation: modalSlideIn .2s ease;
  overflow: hidden;
}
.modal-small { max-width: 360px; }

@keyframes modalSlideIn {
  from { transform: translateY(18px) scale(.97); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--color-primary) 6%, var(--bg-card));
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
}
.modal-title { font-size: .98rem; font-weight: 800; color: var(--color-primary); }
.modal-close {
  width: 30px; height: 30px;
  border: none; background: var(--bg);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: .82rem; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.modal-close:hover { background: var(--border); }

/* ===== FORM ===== */
.event-form { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { font-size: .78rem; font-weight: 700; color: var(--text-sub); }
.required { color: var(--color-danger); }

input[type="text"],
input[type="date"],
input[type="time"],
select,
textarea {
  font-family: inherit;
  font-size: .86rem; font-weight: 500;
  background: var(--bg-input);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 11px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
  max-width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--border-focus); }
input[type="date"],
input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 38px; }
textarea { resize: vertical; min-height: 52px; }
.form-error { font-size: .73rem; color: var(--color-danger); min-height: 1em; }

.color-picker-wrap { display: flex; flex-direction: column; gap: 5px; }
input[type="color"] { width: 100%; height: 36px; border-radius: var(--radius-md); padding: 2px 4px; cursor: pointer; }
.color-presets { display: flex; gap: 5px; }
.color-preset { width: 22px; height: 22px; border: 2px solid transparent; border-radius: 50%; cursor: pointer; transition: transform .15s, border-color .15s; }
.color-preset:hover { transform: scale(1.2); border-color: var(--text); }

.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.delete-confirm-text { padding: 12px 20px; font-size: .88rem; font-weight: 500; color: var(--text-sub); }

/* ================================================
   RESPONSIVE
================================================ */
@media (max-width: 680px) {

  <script>
'use strict';

const STORAGE_KEY = 'countdown_app_v1';

const CATEGORIES = {
  other:       { label: 'その他',       color: '#8b5cf6' },
  work:        { label: '仕事',         color: '#3b82f6' },
  private:     { label: 'プライベート', color: '#10b981' },
  anniversary: { label: '記念日',       color: '#f59e0b' },
};

const RING_R_OUTER = 90;
const RING_R_INNER = 68;
const RING_CIRC_OUTER = 2 * Math.PI * RING_R_OUTER;
const RING_CIRC_INNER = 2 * Math.PI * RING_R_INNER;

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

let state = {
  events: [],
  selectedEventId: null,
  displayStyle: 'digital',
  darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
  animationEnabled: true,
  sortOrder: 'nearest',
};

const flipPrev = { Days: null, Hours: null, Minutes: null, Seconds: null };
let updateIntervalId = null;
let deleteTargetId = null;

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch (e) {}
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function addEvent(data) {
  const evt = {
    id: generateId(),
    name: data.name,
    targetDate: data.date,
    targetTime: data.time || '',
    memo: data.memo || '',
    category: data.category || 'other',
    color: data.color || '#6366f1',
    createdAt: data.createdAt || Date.now(),
  };
  state.events.push(evt);
  if (!state.selectedEventId) state.selectedEventId = evt.id;
  saveState();
  return evt;
}

function updateEvent(id, data) {
  const idx = state.events.findIndex(e => e.id === id);
  if (idx === -1) return;
  state.events[idx] = { ...state.events[idx], name: data.name, targetDate: data.date,
    targetTime: data.time || '', memo: data.memo || '', category: data.category || 'other',
    color: data.color || state.events[idx].color };
  saveState();
}

function deleteEvent(id) {
  state.events = state.events.filter(e => e.id !== id);
  if (state.selectedEventId === id)
    state.selectedEventId = state.events.length > 0 ? state.events[0].id : null;
  saveState();
}

function getSelectedEvent() {
  return state.events.find(e => e.id === state.selectedEventId) || null;
}

function calculateCountdown(evt) {
  const now = Date.now();
  const dtStr = evt.targetTime
    ? `${evt.targetDate}T${evt.targetTime}:00`
    : `${evt.targetDate}T23:59:59`;
  const target = new Date(dtStr).getTime();
  if (isNaN(target)) {
    return { days:0, hours:0, minutes:0, seconds:0, totalMs:0, totalSeconds:0,
             isPast:false, isToday:false, isUrgent:false, percentComplete:0, percentRemaining:100, target };
  }
  const diff = target - now;
  const isPast = diff < 0;
  const absDiff = isPast ? 0 : diff;
  const totalSeconds = Math.floor(absDiff / 1000);
  const days    = Math.floor(totalSeconds / 86400);
  const hours   = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const isToday = new Date(evt.targetDate).toDateString() === new Date().toDateString();
  const isUrgent = !isPast && !isToday && days === 0;
  const start = evt.createdAt || (target - 86400000 * 30);
  const span  = target - start;
  const percentComplete  = span > 0 ? Math.min(100, Math.max(0, (now - start) / span * 100)) : 0;
  const percentRemaining = Math.max(0, 100 - percentComplete);
  return { days, hours, minutes, seconds, totalMs: absDiff, totalSeconds,
           isPast, isToday, isUrgent, percentComplete, percentRemaining, target };
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatDateJP(date) {
  return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}（${WEEKDAYS[date.getDay()]}）`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getStatusText(cd, evt) {
  if (cd.isToday)  return `🎉 本日です！「${evt.name}」の日が来ました！`;
  if (cd.isPast)   return `${cd.days}日 ${pad2(cd.hours)}時間 ${pad2(cd.minutes)}分が経過しました`;
  if (cd.isUrgent) return `⚠️ あと ${pad2(cd.hours)}時間 ${pad2(cd.minutes)}分 ${pad2(cd.seconds)}秒`;
  return `あと ${cd.days}日 ${pad2(cd.hours)}時間 ${pad2(cd.minutes)}分 ${pad2(cd.seconds)}秒`;
}

function getStatusClass(cd) {
  if (cd.isToday)  return 'status-today';
  if (cd.isUrgent) return 'status-urgent';
  if (cd.isPast)   return 'status-past';
  return '';
}

function setStatusEl(id, cd, evt) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = getStatusText(cd, evt);
  el.className = `status-text ${getStatusClass(cd)}`;
}

function renderDigital(cd) {
  document.querySelector('#dDays .digital-value').textContent    = cd.days;
  document.querySelector('#dHours .digital-value').textContent   = pad2(cd.hours);
  document.querySelector('#dMinutes .digital-value').textContent = pad2(cd.minutes);
  document.querySelector('#dSeconds .digital-value').textContent = pad2(cd.seconds);
  const grid = document.getElementById('digitalGrid');
  grid.classList.toggle('is-past',   cd.isPast);
  grid.classList.toggle('is-urgent', cd.isUrgent);
  grid.classList.toggle('is-today',  cd.isToday);
}

function renderRing(cd) {
  const outerPct = cd.isPast ? 0 : cd.percentRemaining / 100;
  const innerPct = cd.isPast ? 0 : cd.seconds / 60;
  const rp  = document.getElementById('ringProgress');
  const rsp = document.getElementById('ringSecProgress');
  if (rp)  rp.style.strokeDashoffset  = RING_CIRC_OUTER * (1 - outerPct);
  if (rsp) rsp.style.strokeDashoffset = RING_CIRC_INNER * (1 - innerPct);
  const cls = getStatusClass(cd);
  if (rp) { rp.classList.remove('is-today','is-urgent','is-past'); if (cls) rp.classList.add(cls); }
  const ringDays = document.getElementById('ringDays');
  const ringTime = document.getElementById('ringTime');
  if (ringDays) ringDays.textContent = cd.days;
  if (ringTime) ringTime.textContent = `${pad2(cd.hours)}:${pad2(cd.minutes)}:${pad2(cd.seconds)}`;
}

function renderAnalog(cd) {
  const dayAngle  = (cd.days  % 30) / 30 * 360;
  const hourAngle = cd.hours / 24 * 360;
  const minAngle  = (cd.minutes + cd.seconds / 60) / 60 * 360;
  const setRotate = (id, deg) => {
    const el = document.getElementById(id);
    if (el) el.setAttribute('transform', `rotate(${deg.toFixed(2)}, 120, 120)`);
  };
  setRotate('analogDayHand',  dayAngle);
  setRotate('analogHourHand', hourAngle);
  setRotate('analogMinHand',  minAngle);
  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  setVal('analogDaysVal',  cd.days);
  setVal('analogHoursVal', pad2(cd.hours));
  setVal('analogMinsVal',  pad2(cd.minutes));
  setVal('analogSecsVal',  pad2(cd.seconds));
}

function renderBar(cd, evt) {
  const pct  = cd.isPast ? 100 : cd.percentComplete;
  const fill = document.getElementById('barFill');
  if (fill) {
    fill.style.width = `${pct.toFixed(1)}%`;
    fill.classList.remove('is-today','is-urgent','is-past');
    const cls = getStatusClass(cd); if (cls) fill.classList.add(cls);
  }
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('barPercent',   `${Math.round(pct)}%`);
  set('barMainValue', cd.isPast ? `${cd.days}日経過` : `あと ${cd.days}日`);
  set('barTimeValue', `${pad2(cd.hours)}:${pad2(cd.minutes)}:${pad2(cd.seconds)}`);
  set('barDays',  cd.days);
  set('barHours', pad2(cd.hours));
  set('barMins',  pad2(cd.minutes));
  set('barSecs',  pad2(cd.seconds));
  set('barStartDate', formatDateJP(new Date(evt.createdAt)));
  set('barEndDate',   formatDateJP(new Date(evt.targetDate)));
}

function renderFlip(cd) {
  const vals = {
    Days:    String(cd.days),
    Hours:   pad2(cd.hours),
    Minutes: pad2(cd.minutes),
    Seconds: pad2(cd.seconds),
  };
  for (const [unit, newVal] of Object.entries(vals)) {
    if (flipPrev[unit] === newVal) continue;
    const topEl        = document.getElementById(`flip${unit}Top`);
    const bottomEl     = document.getElementById(`flip${unit}Bottom`);
    const animTopEl    = document.getElementById(`flip${unit}AnimTop`);
    const animBottomEl = document.getElementById(`flip${unit}AnimBottom`);
    if (!topEl) continue;
    const oldVal = topEl.querySelector('span').textContent;
    if (state.animationEnabled) {
      animTopEl.querySelector('span').textContent    = oldVal;
      animBottomEl.querySelector('span').textContent = newVal;
      animTopEl.classList.remove('flipping-top');
      animBottomEl.classList.remove('flipping-bottom');
      void animTopEl.offsetWidth;
      animTopEl.classList.add('flipping-top');
      animBottomEl.classList.add('flipping-bottom');
      // animTopが裏返しきった280ms時点で両方の静的要素を同時更新
      setTimeout(() => {
        topEl.querySelector('span').textContent    = newVal;
        bottomEl.querySelector('span').textContent = newVal;
      }, 280);
      // animBottom終了後にオーバーレイを非表示
      setTimeout(() => {
        animTopEl.classList.remove('flipping-top');
        animBottomEl.classList.remove('flipping-bottom');
      }, 560);
    } else {
      topEl.querySelector('span').textContent    = newVal;
      bottomEl.querySelector('span').textContent = newVal;
    }
    flipPrev[unit] = newVal;
  }
}

function tick() {
  const evt = getSelectedEvent();
  if (!evt) {
    document.getElementById('noEventMsg').style.display      = 'flex';
    document.getElementById('countdownDisplay').style.display = 'none';
    return;
  }
  document.getElementById('noEventMsg').style.display      = 'none';
  document.getElementById('countdownDisplay').style.display = 'flex';
  const cd = calculateCountdown(evt);

  const nameEl = document.getElementById('displayEventName');
  if (nameEl) { nameEl.textContent = evt.name; nameEl.style.color = evt.color; }
  const catEl   = document.getElementById('displayCategory');
  const catInfo = CATEGORIES[evt.category] || CATEGORIES.other;
  if (catEl) { catEl.textContent = catInfo.label; catEl.style.background = catInfo.color + '22'; catEl.style.color = catInfo.color; }
  const dateEl = document.getElementById('displayDate');
  if (dateEl) dateEl.textContent = formatDateJP(new Date(evt.targetDate)) + (evt.targetTime ? ` ${evt.targetTime}` : '');
  const memoEl = document.getElementById('displayMemo');
  if (memoEl) memoEl.textContent = evt.memo || '';

  switch (state.displayStyle) {
    case 'digital': renderDigital(cd); setStatusEl('digitalStatus', cd, evt); break;
    case 'ring':    renderRing(cd);    setStatusEl('ringStatus',    cd, evt); break;
    case 'analog':  renderAnalog(cd);  setStatusEl('analogStatus',  cd, evt); break;
    case 'bar':     renderBar(cd, evt);setStatusEl('barStatus',     cd, evt); break;
    case 'flip':    renderFlip(cd);    setStatusEl('flipStatus',    cd, evt); break;
  }
}

function getSortedEvents() {
  const evts = [...state.events];
  switch (state.sortOrder) {
    case 'nearest': {
      const now = Date.now();
      return evts.sort((a, b) => {
        const ta = new Date(`${a.targetDate}T23:59:59`).getTime();
        const tb = new Date(`${b.targetDate}T23:59:59`).getTime();
        return Math.abs(ta - now) - Math.abs(tb - now);
      });
    }
    case 'name': return evts.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    default:     return evts.sort((a, b) => a.createdAt - b.createdAt);
  }
}

function renderEventList() {
  const listEl = document.getElementById('eventList');
  if (!listEl) return;
  const evts = getSortedEvents();
  if (evts.length === 0) {
    listEl.innerHTML = '<div class="event-list-empty">イベントがありません<br>「+ 追加」から登録しましょう</div>';
    return;
  }
  listEl.innerHTML = evts.map(evt => {
    const cd       = calculateCountdown(evt);
    const selected = evt.id === state.selectedEventId;
    const catInfo  = CATEGORIES[evt.category] || CATEGORIES.other;
    let badge = '', badgeClass = '';
    if (cd.isToday)       { badge = '本日！';              badgeClass = 'badge-today'; }
    else if (cd.isPast)   { badge = `${cd.days}日経過`;    badgeClass = 'badge-past'; }
    else if (cd.isUrgent) { badge = `あと${pad2(cd.hours)}時間`; badgeClass = 'badge-urgent'; }
    else                  { badge = `あと${cd.days}日`;    badgeClass = ''; }
    const itemCls = ['event-item', selected?'selected':'', cd.isPast?'is-past':'', cd.isToday?'is-today':'', cd.isUrgent?'is-urgent':''].filter(Boolean).join(' ');
    return `<div class="${itemCls}" data-id="${evt.id}" onclick="selectEvent('${evt.id}')">
  <div class="event-item-color" style="background:${escapeHtml(evt.color)}"></div>
  <div class="event-item-body">
    <div class="event-item-row1">
      <span class="event-item-name">${escapeHtml(evt.name)}</span>
      <span class="event-item-badge ${badgeClass}">${badge}</span>
    </div>
    <div class="event-item-row2">
      <span class="event-item-date">${escapeHtml(evt.targetDate)}${evt.targetTime?' '+escapeHtml(evt.targetTime):''}</span>
      <span class="event-item-cat" style="color:${catInfo.color}">${catInfo.label}</span>
    </div>
    ${evt.memo?`<div class="event-item-memo">${escapeHtml(evt.memo)}</div>`:''}
  </div>
  <div class="event-item-actions">
    <button class="icon-btn-sm" onclick="event.stopPropagation();openEditModal('${evt.id}')" title="編集">✏️</button>
    <button class="icon-btn-sm" onclick="event.stopPropagation();openDeleteModal('${evt.id}')" title="削除">🗑️</button>
  </div>
</div>`;
  }).join('');
}

function selectEvent(id) {
  state.selectedEventId = id;
  saveState();
  renderEventList();
  Object.keys(flipPrev).forEach(k => { flipPrev[k] = null; });
  tick();
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = 'イベントを追加';
  document.getElementById('editId').value   = '';
  document.getElementById('eventName').value = '';
  const d = new Date(); d.setDate(d.getDate() + 7);
  document.getElementById('eventDate').value     = d.toISOString().split('T')[0];
  document.getElementById('eventTime').value     = '';
  document.getElementById('eventMemo').value     = '';
  document.getElementById('eventCategory').value = 'other';
  document.getElementById('eventColor').value    = '#6366f1';
  clearFormErrors();
  document.getElementById('eventModal').style.display = 'flex';
  setTimeout(() => document.getElementById('eventName').focus(), 100);
}

function openEditModal(id) {
  const evt = state.events.find(e => e.id === id);
  if (!evt) return;
  document.getElementById('modalTitle').textContent = 'イベントを編集';
  document.getElementById('editId').value           = id;
  document.getElementById('eventName').value        = evt.name;
  document.getElementById('eventDate').value        = evt.targetDate;
  document.getElementById('eventTime').value        = evt.targetTime || '';
  document.getElementById('eventMemo').value        = evt.memo || '';
  document.getElementById('eventCategory').value   = evt.category || 'other';
  document.getElementById('eventColor').value      = evt.color || '#6366f1';
  clearFormErrors();
  document.getElementById('eventModal').style.display = 'flex';
}

function closeModal() { document.getElementById('eventModal').style.display = 'none'; }

function openDeleteModal(id) {
  const evt = state.events.find(e => e.id === id);
  if (!evt) return;
  deleteTargetId = id;
  document.getElementById('deleteConfirmText').textContent = `「${evt.name}」を削除しますか？この操作は元に戻せません。`;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
  deleteTargetId = null;
  document.getElementById('deleteModal').style.display = 'none';
}

function clearFormErrors() {
  ['nameError','dateError'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = ''; });
  ['eventName','eventDate'].forEach(id => { document.getElementById(id)?.classList.remove('error'); });
}

const STYLES = ['digital', 'ring', 'analog', 'bar', 'flip'];

function switchStyle(style) {
  if (!STYLES.includes(style)) return;
  state.displayStyle = style;
  saveState();
  document.querySelectorAll('.style-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.style === style);
    btn.setAttribute('aria-selected', btn.dataset.style === style);
  });
  STYLES.forEach(s => {
    const el = document.getElementById(`style${s.charAt(0).toUpperCase() + s.slice(1)}`);
    if (el) el.style.display = s === style ? 'flex' : 'none';
  });
  if (style === 'flip') Object.keys(flipPrev).forEach(k => { flipPrev[k] = null; });
  tick();
}

function applyDarkMode() {
  document.documentElement.classList.toggle('dark', state.darkMode);
  const btn = document.getElementById('darkToggle');
  if (btn) { btn.textContent = state.darkMode ? '☀️' : '🌙'; btn.title = state.darkMode ? 'ライトモード' : 'ダークモード'; }
}

function toggleDarkMode() { state.darkMode = !state.darkMode; applyDarkMode(); saveState(); }

function applyAnimationState() {
  const btn = document.getElementById('animToggle');
  if (btn) { btn.textContent = state.animationEnabled ? '✨' : '⏸️'; btn.title = state.animationEnabled ? 'アニメーションON' : 'アニメーションOFF'; }
}

function toggleAnimation() { state.animationEnabled = !state.animationEnabled; applyAnimationState(); saveState(); }

function initRingSvg() {
  const outer = document.getElementById('ringProgress');
  const inner = document.getElementById('ringSecProgress');
  if (outer) { outer.style.strokeDasharray = `${RING_CIRC_OUTER} ${RING_CIRC_OUTER}`; outer.style.strokeDashoffset = RING_CIRC_OUTER; }
  if (inner) { inner.style.strokeDasharray = `${RING_CIRC_INNER} ${RING_CIRC_INNER}`; inner.style.strokeDashoffset = RING_CIRC_INNER; }
}

function initAnalogMarks() {
  const g = document.getElementById('analogMarks');
  if (!g) return;
  let html = '';
  for (let i = 0; i < 12; i++) {
    const rad = i * 30 * (Math.PI / 180);
    const major = i % 3 === 0;
    const r1 = 104, r2 = major ? 88 : 96;
    const x1 = (120 + r1 * Math.sin(rad)).toFixed(2);
    const y1 = (120 - r1 * Math.cos(rad)).toFixed(2);
    const x2 = (120 + r2 * Math.sin(rad)).toFixed(2);
    const y2 = (120 - r2 * Math.cos(rad)).toFixed(2);
    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="analog-mark${major?' analog-mark-major':''}"/>`;
  }
  g.innerHTML = html;
}

function createSampleData() {
  const now = new Date();
  const bday = new Date(now); bday.setMonth(bday.getMonth() + 2); bday.setDate(15);
  const trip = new Date(now); trip.setDate(trip.getDate() + 30);
  addEvent({ name:'誕生日', date:bday.toISOString().split('T')[0], time:'00:00', memo:'プレゼントの準備を忘れずに！', category:'anniversary', color:'#f59e0b' });
  addEvent({ name:'旅行',   date:trip.toISOString().split('T')[0], time:'09:00', memo:'荷物の準備・ホテル確認',       category:'private',     color:'#10b981' });
  state.selectedEventId = state.events[0]?.id || null;
  saveState();
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('[PWA] SW 登録完了:', reg.scope))
      .catch(err => console.warn('[PWA] SW 登録失敗:', err));
  });
}

function init() {
  loadState();
  applyDarkMode();
  applyAnimationState();
  initRingSvg();
  initAnalogMarks();
  if (state.events.length === 0) createSampleData();
  document.getElementById('sortSelect').value = state.sortOrder;
  switchStyle(state.displayStyle);
  renderEventList();
  updateIntervalId = setInterval(() => {
    tick();
    if (Date.now() % 10000 < 1100) renderEventList();
  }, 1000);

  document.getElementById('addEventBtn').addEventListener('click', openAddModal);
  document.getElementById('noEventAddBtn').addEventListener('click', openAddModal);
  document.getElementById('darkToggle').addEventListener('click', toggleDarkMode);
  document.getElementById('animToggle').addEventListener('click', toggleAnimation);
  document.getElementById('sortSelect').addEventListener('change', e => { state.sortOrder = e.target.value; saveState(); renderEventList(); });
  document.querySelectorAll('.style-tab').forEach(btn => btn.addEventListener('click', () => switchStyle(btn.dataset.style)));

  document.getElementById('eventForm').addEventListener('submit', e => {
    e.preventDefault();
    let valid = true;
    const name = document.getElementById('eventName').value.trim();
    const date = document.getElementById('eventDate').value;
    if (!name) { document.getElementById('nameError').textContent = 'イベント名を入力してください'; document.getElementById('eventName').classList.add('error'); valid = false; }
    if (!date) { document.getElementById('dateError').textContent = '日付を選択してください'; document.getElementById('eventDate').classList.add('error'); valid = false; }
    if (!valid) return;
    const id   = document.getElementById('editId').value;
    const data = { name, date, time: document.getElementById('eventTime').value, memo: document.getElementById('eventMemo').value.trim(), category: document.getElementById('eventCategory').value, color: document.getElementById('eventColor').value };
    if (id) { updateEvent(id, data); } else { const newEvt = addEvent(data); state.selectedEventId = newEvt.id; saveState(); }
    closeModal();
    renderEventList();
    Object.keys(flipPrev).forEach(k => { flipPrev[k] = null; });
    tick();
  });

  document.querySelectorAll('.color-preset').forEach(btn => btn.addEventListener('click', () => { document.getElementById('eventColor').value = btn.dataset.color; }));

  document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
    if (deleteTargetId) { deleteEvent(deleteTargetId); closeDeleteModal(); renderEventList(); tick(); }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDeleteModal(); } });

  registerServiceWorker();
}

document.addEventListener('DOMContentLoaded', init);
  </script>
