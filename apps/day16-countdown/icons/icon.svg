<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="#6366f1"/>
  <!-- 時計外枠 -->
  <circle cx="256" cy="272" r="168" fill="none" stroke="white" stroke-width="22" opacity="0.9"/>
  <!-- 時計内（塗り） -->
  <circle cx="256" cy="272" r="145" fill="rgba(255,255,255,0.12)"/>
  <!-- 時針（太・白） -->
  <line x1="256" y1="272" x2="256" y2="150" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- 分針（細・白） -->
  <line x1="256" y1="272" x2="346" y2="298" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="256" cy="272" r="14" fill="white"/>
  <!-- 上部の突起（時計のリューズ） -->
  <rect x="236" y="92" width="40" height="24" rx="10" fill="white" opacity="0.85"/>
</svg>
