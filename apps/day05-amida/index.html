<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Day 05 - あみだくじ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100svh; overflow: hidden;
  background: linear-gradient(145deg, #4c1d95 0%, #1e1b4b 35%, #0e7490 70%, #7c3aed 100%);
  font-family: 'M PLUS Rounded 1c', sans-serif;
  color: #fff;
}

#app { width: 100%; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }

.screen { display: none; flex-direction: column; height: 100svh; overflow: hidden; }
.screen.active { display: flex; }

/* HEADER */
.hdr {
  flex-shrink: 0; text-align: center; padding: 8px 12px 4px;
  background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 100%);
}
.hdr h1 {
  font-size: 1.2rem; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, #e879f9, #22d3ee);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px #e879f950);
}

/* FOX ROW */
.fox-row {
  flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; gap: 8px; padding: 3px 12px;
}
.fox-icon { font-size: 1.8rem; filter: drop-shadow(0 0 6px #fbbf2460); }
.fox-bubble {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px; padding: 4px 14px;
  font-size: 0.72rem; font-weight: 700; color: #fde68a;
  text-shadow: 0 0 8px #fbbf24;
}

/* SETUP */
.setup-body { flex: 1; overflow-y: auto; padding: 5px 13px 5px; display: flex; flex-direction: column; gap: 7px; }
.card {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; padding: 9px 12px;
}
.card-title { font-size: 0.67rem; font-weight: 700; color: #22d3ee; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; }
.count-row { display: flex; align-items: center; justify-content: space-between; }
.cnt-ctrl { display: flex; align-items: center; gap: 10px; }
.cnt-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
  color: #fff; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.cnt-btn:active { background: rgba(255,255,255,0.25); }
.cnt-val { font-size: 1.2rem; font-weight: 900; color: #e879f9; min-width: 22px; text-align: center; }
.names-grid { display: grid; gap: 5px; margin-top: 8px; }
.inp-row { display: flex; gap: 6px; align-items: center; }
.inp-row span { font-size: 0.95rem; }
.inp {
  flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.77rem;
  padding: 6px 10px; outline: none; transition: border-color .2s;
}
.inp:focus { border-color: #e879f9; box-shadow: 0 0 8px #e879f930; }
.inp::placeholder { color: rgba(255,255,255,0.38); }
.labels-grid { display: grid; gap: 5px; }

.btn-main {
  flex-shrink: 0; margin: 6px 13px 10px; padding: 12px;
  background: linear-gradient(135deg, #7c3aed, #0891b2); border: none; border-radius: 13px;
  color: #fff; font-family: inherit; font-size: 0.98rem; font-weight: 900;
  letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 20px #7c3aed60; transition: all .2s;
}
.btn-main:active { transform: scale(0.97); }

/* GAME */
.turn-bar {
  flex-shrink: 0; margin: 3px 13px; padding: 7px 13px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.turn-label { font-size: 0.65rem; color: rgba(255,255,255,0.55); font-weight: 700; }
.turn-name { font-size: 0.92rem; font-weight: 900; color: #fde68a; text-shadow: 0 0 8px #fbbf24; }
.turn-prog { font-size: 0.65rem; color: rgba(255,255,255,0.5); }

.col-btns { flex-shrink: 0; display: flex; gap: 5px; justify-content: center; padding: 3px 13px; }
.col-btn {
  flex: 1; max-width: 50px; height: 34px; border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1);
  color: #fff; font-family: inherit; font-size: 0.82rem; font-weight: 900;
  cursor: pointer; transition: all .2s;
}
.col-btn:active:not(:disabled) { transform: scale(0.93); }
.col-btn:disabled { opacity: 0.35; cursor: default; }
.col-btn.taken { border-width: 2px; opacity: 0.85; }

.amida-wrap { flex: 1; min-height: 0; padding: 3px 10px 3px; display: flex; }
#amidaCanvas { width: 100%; height: 100%; display: block; border-radius: 10px; }

.game-foot { flex-shrink: 0; padding: 5px 13px max(10px, env(safe-area-inset-bottom)); }
.btn-next {
  width: 100%; padding: 12px; display: none;
  background: linear-gradient(135deg, #e879f9, #7c3aed); border: none; border-radius: 12px;
  color: #fff; font-family: inherit; font-size: 0.92rem; font-weight: 900;
  letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 16px #e879f940; transition: all .2s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.btn-next.vis { display: block; }
.btn-next:active { transform: scale(0.97); }

/* RESULTS */
#result { align-items: center; justify-content: center; gap: 8px; padding: 12px 15px max(12px, env(safe-area-inset-bottom)); }
#result h2 {
  font-size: 1.05rem; font-weight: 900;
  background: linear-gradient(90deg, #fde68a, #f472b6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 5px #fbbf2450);
}
.result-list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 54svh; }
.ri {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 11px; padding: 8px 13px;
  animation: popIn .35s ease both;
}
@keyframes popIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ri-num { font-size: 1.2rem; font-weight: 900; min-width: 26px; text-align: center; }
.ri-name { flex: 1; font-size: 0.88rem; font-weight: 700; }
.ri-label { font-size: 0.73rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); }
.btn-row { display: flex; gap: 8px; width: 100%; max-width: 360px; }
.btn-reset {
  flex: 1; padding: 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
  font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
}
.btn-again {
  flex: 1; padding: 11px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #7c3aed, #0891b2);
  color: #fff; font-family: inherit; font-size: 0.82rem; font-weight: 900;
  cursor: pointer; letter-spacing: 1px; box-shadow: 0 0 10px #7c3aed40;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

<!-- SETUP -->
<div id="setup" class="screen active">
  <div class="hdr"><h1>🦊 あみだくじ</h1></div>
  <div class="fox-row">
    <span class="fox-icon">🦊</span>
    <div class="fox-bubble" id="foxSetup">何人で引くかの？</div>
  </div>
  <div class="setup-body">
    <div class="card">
      <div class="count-row">
        <div class="card-title" style="margin:0">参加人数</div>
        <div class="cnt-ctrl">
          <button class="cnt-btn" id="btnMinus">－</button>
          <div class="cnt-val" id="cntVal">3</div>
          <button class="cnt-btn" id="btnPlus">＋</button>
        </div>
      </div>
      <div class="names-grid" id="namesGrid"></div>
    </div>
    <div class="card">
      <div class="card-title">🏷 結果ラベル</div>
      <div class="labels-grid" id="labelsGrid"></div>
    </div>
  </div>
  <button class="btn-main" id="btnToGame">✨ くじを作る</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="hdr"><h1>🦊 あみだくじ</h1></div>
  <div class="fox-row">
    <span class="fox-icon">🦊</span>
    <div class="fox-bubble" id="foxGame">スタート位置を選ぶのじゃ！</div>
  </div>
  <div class="turn-bar">
    <div>
      <div class="turn-label">NOW SELECTING</div>
      <div class="turn-name" id="turnName">プレイヤー1</div>
    </div>
    <div class="turn-prog" id="turnProg">1 / 3</div>
  </div>
  <div class="col-btns" id="colBtns"></div>
  <div class="amida-wrap">
    <canvas id="amidaCanvas"></canvas>
  </div>
  <div class="game-foot">
    <button class="btn-next" id="btnNext">次の人へ →</button>
  </div>
</div>

<!-- RESULTS -->
<div id="result" class="screen">
  <div class="fox-row">
    <span class="fox-icon" style="font-size:2.4rem">🦊</span>
    <div class="fox-bubble" id="foxResult">運命は決まったぞ！</div>
  </div>
  <h2>🎴 結 果 発 表 🎴</h2>
  <div class="result-list" id="resultList"></div>
  <div class="btn-row">
    <button class="btn-reset" id="btnReset">⚙ 最初から</button>
    <button class="btn-again" id="btnAgain">🔄 もう一度</button>
  </div>
</div>

</div>
<script>
// ===== AUDIO =====
let actx;
const ac = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; };
function beep(freq, dur, type = 'sine', vol = 0.22) {
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur);
  } catch (e) {}
}
function playTick() { beep(900, 0.04, 'square', 0.1); }
function playTurn() { beep(440, 0.06, 'sine', 0.18); }
function playSelect() { beep(660, 0.09, 'sine', 0.22); setTimeout(() => beep(880, 0.07, 'sine', 0.18), 90); }
function playFanfare() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.22), i * 110)); }
function playWhoosh() {
  try {
    const c = ac(), buf = c.createBuffer(1, c.sampleRate * 0.14, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / d.length * 10);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 1.5;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination);
    g.gain.value = 0.4; s.start();
  } catch (e) {}
}

// ===== STATE =====
let playerCount = 3;
let playerNames = [];
let resultLabels = [];
let amidaBars = [];  // [{row, col, type:'h'|'d', slope:1|-1}]
let barLookup = [];  // [col][row] = {destCol, type, slope, isOrigin} | null
const ROWS = 10;
const MIN_BARS = 7;

let currentPlayer = 0;
let selectedCols = [];     // [colIdx for P0, colIdx for P1, ...] -1=not yet
let playerPaths = [];      // [{endCol, waypoints}] per player
let phase = 'select';      // 'select' | 'animating' | 'between'

// Animation
let animFrac = 0, animTs0 = null, animRaf = null, lastCrossedWp = 0;
const ANIM_DUR = 2400;

// Player colors
const PCOLS = [
  { stroke: '#f472b6', glow: '#f472b680' },
  { stroke: '#22d3ee', glow: '#22d3ee80' },
  { stroke: '#fbbf24', glow: '#fbbf2480' },
  { stroke: '#4ade80', glow: '#4ade8080' },
  { stroke: '#a78bfa', glow: '#a78bfa80' },
  { stroke: '#fb923c', glow: '#fb923c80' },
];

// ===== CANVAS =====
const canvas = document.getElementById('amidaCanvas');
const ctx2 = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth - 20;
  const H = wrap.clientHeight - 6;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx2.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function getLayout() {
  const W = parseFloat(canvas.style.width) || 300;
  const H = parseFloat(canvas.style.height) || 400;
  const n = playerCount;
  const padX = 28, padTop = 22, padBot = 18;
  const colW = n > 1 ? (W - padX * 2) / (n - 1) : 0;
  const rowH = (H - padTop - padBot) / (ROWS + 1);
  const cols = Array.from({ length: n }, (_, i) => padX + i * colW);
  const yTop = padTop, yBot = H - padBot;
  const rowY = r => yTop + (r + 1) * rowH;
  return { W, H, n, cols, yTop, yBot, rowH, rowY };
}

// ===== GENERATE AMIDA =====
function generateAmida(n) {
  let bars, lookup, tries = 0;
  do {
    bars = [];
    lookup = Array.from({ length: n }, () => Array(ROWS).fill(null));
    for (let r = 0; r < ROWS; r++) {
      // shuffle columns for this row
      const order = Array.from({ length: n - 1 }, (_, i) => i).sort(() => Math.random() - .5);
      for (const c of order) {
        if (!lookup[c][r] && !lookup[c + 1][r] && Math.random() < 0.65) {
          // 30% chance diagonal
          const type = Math.random() < 0.3 ? 'd' : 'h';
          const slope = Math.random() < 0.5 ? 1 : -1;
          lookup[c][r] = { destCol: c + 1, type, slope, isOrigin: true };
          lookup[c + 1][r] = { destCol: c, type, slope, isOrigin: false };
          bars.push({ row: r, col: c, type, slope });
        }
      }
    }
    tries++;
  } while (bars.length < MIN_BARS && tries < 100);
  amidaBars = bars;
  barLookup = lookup;
}

// ===== TRACE PATH =====
// Returns {endCol, waypoints:[{x,y}]}
function tracePath(startCol) {
  const { cols, yTop, yBot, rowH, rowY } = getLayout();
  const dy = rowH * 0.3;
  let c = startCol;
  const wps = [{ x: cols[c], y: yTop }];

  for (let r = 0; r < ROWS; r++) {
    const e = barLookup[c]?.[r];
    if (e) {
      let yHere, yThere;
      if (e.type === 'h') {
        yHere = yThere = rowY(r);
      } else if (e.isOrigin) {
        // going right: left end is y - slope*dy, right end is y + slope*dy
        yHere  = rowY(r) - e.slope * dy;
        yThere = rowY(r) + e.slope * dy;
      } else {
        // going left: this col is the right end, dest is left end
        yHere  = rowY(r) + e.slope * dy;
        yThere = rowY(r) - e.slope * dy;
      }
      wps.push({ x: cols[c], y: yHere });
      wps.push({ x: cols[e.destCol], y: yThere });
      c = e.destCol;
    }
  }
  wps.push({ x: cols[c], y: yBot });
  return { endCol: c, waypoints: wps };
}

function wpTotalLen(wps) {
  let len = 0;
  for (let i = 1; i < wps.length; i++)
    len += Math.hypot(wps[i].x - wps[i-1].x, wps[i].y - wps[i-1].y);
  return len;
}

// ===== DRAW =====
function draw() {
  const { W, H, n, cols, yTop, yBot, rowH, rowY } = getLayout();
  const dy = rowH * 0.3;
  ctx2.clearRect(0, 0, W, H);

  // vertical lines — bright white for visibility
  for (let c = 0; c < n; c++) {
    ctx2.beginPath();
    ctx2.moveTo(cols[c], yTop);
    ctx2.lineTo(cols[c], yBot);
    ctx2.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx2.lineWidth = 2.5;
    ctx2.shadowColor = 'rgba(255,255,255,0.3)';
    ctx2.shadowBlur = 4;
    ctx2.stroke();
    ctx2.shadowBlur = 0;
  }

  // bars (horizontal + diagonal) — bright white
  for (const bar of amidaBars) {
    const { row: r, col, type, slope } = bar;
    let x1 = cols[col], y1, x2 = cols[col + 1], y2;
    const y = rowY(r);
    if (type === 'h') { y1 = y2 = y; }
    else { y1 = y - slope * dy; y2 = y + slope * dy; }

    ctx2.beginPath();
    ctx2.moveTo(x1, y1); ctx2.lineTo(x2, y2);
    ctx2.strokeStyle = '#ffffff';
    ctx2.lineWidth = 3;
    ctx2.shadowColor = 'rgba(255,255,255,0.7)';
    ctx2.shadowBlur = 8;
    ctx2.lineCap = 'round';
    ctx2.stroke();
    ctx2.shadowBlur = 0;
  }

  // completed player paths (static, slightly faded)
  for (let pi = 0; pi < playerPaths.length; pi++) {
    if (!playerPaths[pi]) continue;
    const pc = PCOLS[pi % PCOLS.length];
    const wps = playerPaths[pi].waypoints;
    ctx2.beginPath();
    ctx2.moveTo(wps[0].x, wps[0].y);
    for (let i = 1; i < wps.length; i++) ctx2.lineTo(wps[i].x, wps[i].y);
    ctx2.strokeStyle = pc.stroke;
    ctx2.lineWidth = 3.5;
    ctx2.globalAlpha = 0.65;
    ctx2.shadowColor = pc.glow; ctx2.shadowBlur = 8;
    ctx2.lineJoin = 'round'; ctx2.lineCap = 'round';
    ctx2.stroke();
    ctx2.globalAlpha = 1; ctx2.shadowBlur = 0;

    // endpoint dot
    const endWp = wps[wps.length - 1];
    ctx2.beginPath(); ctx2.arc(endWp.x, endWp.y, 5, 0, Math.PI * 2);
    ctx2.fillStyle = pc.stroke;
    ctx2.shadowColor = pc.glow; ctx2.shadowBlur = 10;
    ctx2.fill(); ctx2.shadowBlur = 0;
  }

  // current animating path (partial)
  if (phase === 'animating' && animTs0 !== null) {
    const pi = currentPlayer;
    if (playerPaths[pi]) {
      const pc = PCOLS[pi % PCOLS.length];
      const wps = playerPaths[pi].waypoints;
      const totalLen = wpTotalLen(wps);
      const drawLen = totalLen * animFrac;
      let drawn = 0;
      let dotX = wps[0].x, dotY = wps[0].y;

      ctx2.beginPath();
      ctx2.moveTo(wps[0].x, wps[0].y);
      for (let i = 1; i < wps.length; i++) {
        const dx = wps[i].x - wps[i-1].x, dy2 = wps[i].y - wps[i-1].y;
        const segLen = Math.hypot(dx, dy2);
        const remain = drawLen - drawn;
        if (remain <= 0) break;
        if (remain >= segLen) {
          ctx2.lineTo(wps[i].x, wps[i].y);
          dotX = wps[i].x; dotY = wps[i].y;
          drawn += segLen;
        } else {
          const t = remain / segLen;
          dotX = wps[i-1].x + dx * t; dotY = wps[i-1].y + dy2 * t;
          ctx2.lineTo(dotX, dotY);
          break;
        }
      }
      ctx2.strokeStyle = pc.stroke;
      ctx2.lineWidth = 4;
      ctx2.shadowColor = pc.glow; ctx2.shadowBlur = 14;
      ctx2.lineJoin = 'round'; ctx2.lineCap = 'round';
      ctx2.stroke(); ctx2.shadowBlur = 0;

      // glowing leading dot
      ctx2.beginPath(); ctx2.arc(dotX, dotY, 7, 0, Math.PI * 2);
      ctx2.fillStyle = pc.stroke;
      ctx2.shadowColor = pc.glow; ctx2.shadowBlur = 18;
      ctx2.fill(); ctx2.shadowBlur = 0;
    }
  }

  // top column labels / dots
  for (let c = 0; c < n; c++) {
    const pi = selectedCols.indexOf(c);
    const pc = pi >= 0 ? PCOLS[pi % PCOLS.length] : null;
    const color = pc ? pc.stroke : 'rgba(255,255,255,0.55)';
    const label = pi >= 0 ? (playerNames[pi] || `P${pi+1}`).slice(0, 4) : `${c+1}`;

    ctx2.fillStyle = color;
    ctx2.font = `bold ${Math.min(11, Math.max(7, 280 / n))}px 'M PLUS Rounded 1c'`;
    ctx2.textAlign = 'center';
    ctx2.shadowColor = color; ctx2.shadowBlur = pc ? 7 : 0;
    ctx2.fillText(label, cols[c], yTop - 7);
    ctx2.shadowBlur = 0;

    ctx2.beginPath(); ctx2.arc(cols[c], yTop, 5, 0, Math.PI * 2);
    ctx2.fillStyle = color;
    ctx2.shadowColor = pc ? pc.glow : 'transparent'; ctx2.shadowBlur = pc ? 10 : 0;
    ctx2.fill(); ctx2.shadowBlur = 0;
  }

  // bottom dots (labels hidden until results)
  for (let c = 0; c < n; c++) {
    ctx2.beginPath(); ctx2.arc(cols[c], yBot, 4, 0, Math.PI * 2);
    ctx2.fillStyle = 'rgba(255,255,255,0.4)';
    ctx2.shadowColor = 'rgba(255,255,255,0.3)'; ctx2.shadowBlur = 4;
    ctx2.fill(); ctx2.shadowBlur = 0;
  }
}

// ===== ANIMATION LOOP =====
function animLoop(ts) {
  if (!animTs0) animTs0 = ts;
  animFrac = Math.min(1, (ts - animTs0) / ANIM_DUR);

  // tick sounds at waypoint crossings
  if (playerPaths[currentPlayer]) {
    const wps = playerPaths[currentPlayer].waypoints;
    const totalLen = wpTotalLen(wps);
    const drawLen = totalLen * animFrac;
    let acc = 0;
    for (let i = 1; i < wps.length; i++) {
      acc += Math.hypot(wps[i].x - wps[i-1].x, wps[i].y - wps[i-1].y);
      if (i > lastCrossedWp && drawLen >= acc) { playTick(); lastCrossedWp = i; }
    }
  }

  draw();

  if (animFrac < 1) {
    animRaf = requestAnimationFrame(animLoop);
  } else {
    phase = 'between';
    const isLast = currentPlayer >= playerCount - 1;
    const btn = document.getElementById('btnNext');
    btn.textContent = isLast ? '🎴 結果を見る！' : '次の人へ →';
    btn.classList.add('vis');
    document.getElementById('foxGame').textContent = isLast ? 'さあ、結果を見よ！' : '次の者よ、参れ！';
    playFanfare();
  }
}

// ===== SETUP =====
function buildSetup() {
  buildNames(); buildLabels();
}

const icons = ['🧑','👩','🧒','👦','🙋','🙍'];
function buildNames() {
  const g = document.getElementById('namesGrid');
  g.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    const row = document.createElement('div'); row.className = 'inp-row';
    const ic = document.createElement('span'); ic.textContent = icons[i] || '👤';
    const inp = document.createElement('input'); inp.className = 'inp';
    inp.placeholder = `プレイヤー${i+1}`; inp.value = playerNames[i] || '';
    inp.oninput = () => playerNames[i] = inp.value;
    row.appendChild(ic); row.appendChild(inp); g.appendChild(row);
  }
}

const defLabels = ['🎯 当たり','❌ ハズレ','😂 罰ゲーム','🎁 プレゼント','👑 1等','💀 大ハズレ'];
function buildLabels() {
  const g = document.getElementById('labelsGrid');
  g.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    const inp = document.createElement('input'); inp.className = 'inp';
    inp.placeholder = `ラベル ${i+1}`;
    inp.value = resultLabels[i] || defLabels[i % defLabels.length];
    inp.oninput = () => resultLabels[i] = inp.value;
    resultLabels[i] = inp.value;
    g.appendChild(inp);
  }
}

const foxSetupMsg = ['2人で決めよ！','3人の運命じゃ！','4人で参ろう！','5人の挑戦！','6人、いざ！'];
document.getElementById('btnMinus').onclick = () => {
  if (playerCount <= 2) return;
  playerCount--;
  document.getElementById('cntVal').textContent = playerCount;
  document.getElementById('foxSetup').textContent = foxSetupMsg[playerCount - 2];
  beep(400, 0.06, 'sine', 0.18); buildSetup();
};
document.getElementById('btnPlus').onclick = () => {
  if (playerCount >= 6) return;
  playerCount++;
  document.getElementById('cntVal').textContent = playerCount;
  document.getElementById('foxSetup').textContent = foxSetupMsg[playerCount - 2];
  beep(600, 0.06, 'sine', 0.18); buildSetup();
};
document.getElementById('btnToGame').onclick = () => {
  const ni = document.querySelectorAll('#namesGrid .inp');
  playerNames = Array.from(ni).map((el, i) => el.value.trim() || `P${i+1}`);
  const li = document.querySelectorAll('#labelsGrid .inp');
  resultLabels = Array.from(li).map((el, i) => el.value.trim() || `賞品${i+1}`);
  beep(523, 0.1, 'sine', 0.25); setTimeout(() => beep(659, 0.1, 'sine', 0.22), 110);
  startGame();
};

// ===== GAME =====
function startGame() {
  currentPlayer = 0;
  selectedCols = new Array(playerCount).fill(-1);
  playerPaths = new Array(playerCount).fill(null);
  phase = 'select';
  animTs0 = null; animFrac = 0; lastCrossedWp = 0;
  if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }

  generateAmida(playerCount);
  showScreen('game');

  requestAnimationFrame(() => {
    resizeCanvas();
    updateTurnBar();
    buildColBtns();
    draw();
  });

  document.getElementById('btnNext').classList.remove('vis');
  document.getElementById('foxGame').textContent = 'スタート位置を選ぶのじゃ！';
}

function updateTurnBar() {
  document.getElementById('turnName').textContent = playerNames[currentPlayer] || `P${currentPlayer+1}`;
  document.getElementById('turnProg').textContent = `${currentPlayer+1} / ${playerCount}`;
  // color the turn bar border to match player
  const pc = PCOLS[currentPlayer % PCOLS.length];
  document.querySelector('.turn-bar').style.borderColor = pc.stroke + '80';
}

function buildColBtns() {
  const container = document.getElementById('colBtns');
  container.innerHTML = '';
  for (let c = 0; c < playerCount; c++) {
    const btn = document.createElement('button');
    btn.className = 'col-btn';
    btn.textContent = `${c+1}`;
    const takenBy = selectedCols.indexOf(c);
    if (takenBy >= 0) {
      btn.classList.add('taken');
      btn.disabled = true;
      const pc = PCOLS[takenBy % PCOLS.length];
      btn.style.borderColor = pc.stroke;
      btn.style.color = pc.stroke;
      btn.style.background = pc.stroke + '22';
    } else if (phase !== 'select') {
      btn.disabled = true;
    } else {
      const pc = PCOLS[currentPlayer % PCOLS.length];
      btn.style.borderColor = 'rgba(255,255,255,0.5)';
      btn.onclick = () => selectCol(c);
      btn.onmouseenter = () => { btn.style.borderColor = pc.stroke; btn.style.background = pc.stroke + '22'; };
      btn.onmouseleave = () => { btn.style.borderColor = 'rgba(255,255,255,0.5)'; btn.style.background = 'rgba(255,255,255,0.1)'; };
    }
    container.appendChild(btn);
  }
}

function selectCol(col) {
  if (phase !== 'select') return;
  if (selectedCols.includes(col)) return;
  playSelect();
  selectedCols[currentPlayer] = col;
  phase = 'animating';
  animTs0 = null; animFrac = 0; lastCrossedWp = 0;

  // Compute path now (canvas already sized)
  playerPaths[currentPlayer] = tracePath(col);

  buildColBtns();
  document.getElementById('btnNext').classList.remove('vis');
  document.getElementById('foxGame').textContent = 'いざ、参らん！';
  playWhoosh();

  animRaf = requestAnimationFrame(animLoop);
}

document.getElementById('btnNext').onclick = () => {
  document.getElementById('btnNext').classList.remove('vis');
  const isLast = currentPlayer >= playerCount - 1;
  if (isLast) {
    showResults();
  } else {
    currentPlayer++;
    phase = 'select';
    animTs0 = null; animFrac = 0; lastCrossedWp = 0;
    updateTurnBar();
    buildColBtns();
    document.getElementById('foxGame').textContent = 'スタート位置を選ぶのじゃ！';
    playTurn();
    resizeCanvas(); draw();
  }
};

// ===== RESULTS =====
function showResults() {
  showScreen('result');
  const list = document.getElementById('resultList');
  list.innerHTML = '';

  const items = playerPaths.map((p, pi) => ({ pi, endCol: p.endCol, name: playerNames[pi] }))
    .sort((a, b) => a.endCol - b.endCol);

  items.forEach((item, i) => {
    const pc = PCOLS[item.pi % PCOLS.length];
    const el = document.createElement('div'); el.className = 'ri';
    el.style.animationDelay = `${i * 0.08}s`;
    el.style.borderColor = pc.stroke + '50';

    const num = document.createElement('div'); num.className = 'ri-num';
    num.textContent = `${item.endCol + 1}`; num.style.color = pc.stroke;

    const name = document.createElement('div'); name.className = 'ri-name';
    name.textContent = item.name;

    const lbl = document.createElement('div'); lbl.className = 'ri-label';
    lbl.textContent = resultLabels[item.endCol] || `賞品${item.endCol+1}`;
    lbl.style.borderColor = pc.stroke + '60'; lbl.style.color = pc.stroke;

    el.appendChild(num); el.appendChild(name); el.appendChild(lbl);
    list.appendChild(el);
  });

  const msgs = ['運命は決まったぞ！','これが天の声じゃ！','受け入れるがよい！'];
  document.getElementById('foxResult').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  setTimeout(playFanfare, 200);
}

document.getElementById('btnAgain').onclick = () => { beep(523, 0.08, 'sine', 0.2); startGame(); };
document.getElementById('btnReset').onclick = () => { beep(400, 0.08, 'sine', 0.18); showScreen('setup'); };

// ===== UTILS =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.addEventListener('resize', () => {
  if (document.getElementById('game').classList.contains('active')) {
    resizeCanvas(); draw();
  }
});

// INIT
buildSetup();
</script>
</body>
