<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day02 - コイントス</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 8px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 8px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Top row: coin + stats */
    .top-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 8px;
    }

    /* Coin */
    .coin-scene {
      perspective: 600px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .coin-wrapper {
      width: 90px;
      height: 90px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.05s;
    }

    .coin-wrapper.flipping {
      animation: coinFlip 1s ease-out forwards;
    }

    @keyframes coinFlip {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      20%  { transform: rotateY(360deg) rotateX(20deg) translateY(-18px); }
      40%  { transform: rotateY(720deg) rotateX(10deg) translateY(-30px); }
      60%  { transform: rotateY(1080deg) rotateX(5deg) translateY(-18px); }
      80%  { transform: rotateY(1440deg) rotateX(0deg) translateY(-6px); }
      100% { transform: rotateY(var(--final-rotation)) rotateX(0deg) translateY(0px); }
    }

    .coin-face {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 1.8rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25), inset 0 2px 5px rgba(255,255,255,0.4);
    }

    .coin-heads {
      background: radial-gradient(circle at 35% 35%, #FFE566, #F5A623, #D4880A);
      border: 4px solid #E8A000;
    }

    .coin-tails {
      background: radial-gradient(circle at 35% 35%, #e0e0e0, #b0b0b0, #888);
      border: 4px solid #999;
      transform: rotateY(180deg);
    }

    .coin-face .face-label {
      font-size: 0.55rem;
      font-weight: 800;
      margin-top: 2px;
      color: rgba(0,0,0,0.45);
    }

    /* Result + stats column */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-text {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-height: 1.4rem;
    }

    .result-text.show { opacity: 1; transform: scale(1); }
    .result-text.heads-result { color: #FFD700; }
    .result-text.tails-result { color: #fff; }

    .result-sub {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease 0.2s;
      min-height: 0.9rem;
    }
    .result-sub.show { opacity: 1; }

    /* Stats inline */
    .stats-inline {
      display: flex;
      gap: 6px;
    }

    .stat-card {
      flex: 1;
      background: rgba(255,255,255,0.35);
      border-radius: 10px;
      padding: 5px 4px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.5);
    }

    .stat-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 900;
      color: #fff;
    }

    .stat-value.heads { color: #FFD700; }

    /* Bet section */
    .bet-section {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 8px 12px;
      border: 2px solid rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    .bet-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .bet-title {
      font-size: 0.65rem;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
    }

    .wallet-value {
      font-size: 0.95rem;
      font-weight: 900;
      color: #FFD700;
    }

    .bet-choice-row {
      display: flex;
      gap: 7px;
      margin-bottom: 6px;
    }

    .bet-choice-btn {
      flex: 1;
      padding: 6px;
      border: 3px solid transparent;
      border-radius: 9px;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bet-choice-btn.heads-btn {
      background: linear-gradient(135deg, #FFE566, #F5A623);
      color: #7a5000;
    }

    .bet-choice-btn.tails-btn {
      background: linear-gradient(135deg, #e0e0e0, #aaa);
      color: #444;
    }

    .bet-choice-btn.selected {
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .bet-amount-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .bet-amount-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      min-width: 36px;
    }

    .bet-presets {
      display: flex;
      gap: 5px;
      flex: 1;
    }

    .bet-preset-btn {
      flex: 1;
      padding: 5px 2px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 7px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bet-preset-btn.active {
      background: rgba(255,255,255,0.6);
      color: #333;
      border-color: #fff;
    }

    .bet-result-msg {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      opacity: 0;
      transition: all 0.3s;
      line-height: 1;
    }

    .bet-result-msg.show { opacity: 1; }
    .bet-result-msg.win { color: #FFD700; }
    .bet-result-msg.lose { color: #FF6B6B; }

    /* Toss button */
    .toss-btn {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 11px 44px;
      font-size: 1.05rem;
      font-weight: 900;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255,107,107,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .toss-btn:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(255,107,107,0.4); }
    .toss-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Bottom card: prob + history */
    .bottom-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 8px 12px;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .prob-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .prob-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: #fff;
      min-width: 24px;
    }

    .prob-bar {
      flex: 1;
      height: 11px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      overflow: hidden;
    }

    .prob-fill-heads {
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #F5A623);
      border-radius: 6px;
      transition: width 0.5s ease;
      width: 50%;
    }

    .prob-fill-tails {
      height: 100%;
      background: linear-gradient(90deg, #ccc, #999);
      border-radius: 6px;
      transition: width 0.5s ease;
      width: 50%;
    }

    .prob-pct {
      font-size: 0.65rem;
      font-weight: 800;
      color: #fff;
      min-width: 28px;
      text-align: right;
    }

    .history-list {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-top: 6px;
    }

    .history-list::-webkit-scrollbar { display: none; }

    .history-item {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .history-item.h {
      background: radial-gradient(circle at 35% 35%, #FFE566, #F5A623);
      border: 2px solid #E8A000;
    }

    .history-item.t {
      background: radial-gradient(circle at 35% 35%, #e0e0e0, #aaa);
      border: 2px solid #999;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    .modal-box {
      background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
      border-radius: 20px;
      padding: 24px 28px;
      text-align: center;
      max-width: 280px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .modal-emoji { font-size: 2.5rem; margin-bottom: 8px; }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: #333;
      margin-bottom: 6px;
    }
    .modal-msg {
      font-size: 0.85rem;
      color: #666;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
    }
    .modal-btn.secondary {
      background: #e0e0e0;
      color: #555;
    }

    /* Particles */
    .particle-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: particleFly 0.8s ease-out forwards;
    }

    @keyframes particleFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="particle-container" id="particles"></div>

  <!-- Custom Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-emoji">💸</div>
      <div class="modal-title">コイン切れ！</div>
      <div class="modal-msg">所持コインが0になりました。<br>1000コインでリセットしますか？</div>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="closeModal(false)">やめる</button>
        <button class="modal-btn primary" onclick="closeModal(true)">リセット！</button>
      </div>
    </div>
  </div>

  <h1>🪙 COIN TOSS</h1>
  <p class="subtitle">タップしてコインを投げよう！</p>

  <!-- Top row: coin left, result+stats right -->
  <div class="top-row">
    <div class="coin-scene" id="coinScene">
      <div class="coin-wrapper" id="coinWrapper">
        <div class="coin-face coin-heads">
          <span>😊</span>
          <span class="face-label">HEADS</span>
        </div>
        <div class="coin-face coin-tails">
          <span>⭐</span>
          <span class="face-label">TAILS</span>
        </div>
      </div>
    </div>
    <div class="right-col">
      <div class="result-text" id="resultText"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="stats-inline">
        <div class="stat-card">
          <div class="stat-label">TOTAL</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">HEADS</div>
          <div class="stat-value heads" id="headsCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">TAILS</div>
          <div class="stat-value" id="tailsCount">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bet Section -->
  <div class="bet-section">
    <div class="bet-top-row">
      <span class="bet-title">💰 賭けモード</span>
      <span class="wallet-value">🪙 <span id="walletValue">1000</span></span>
    </div>
    <div class="bet-choice-row">
      <button class="bet-choice-btn heads-btn" id="betHeadsBtn" onclick="selectBet('heads')">😊 表に賭ける</button>
      <button class="bet-choice-btn tails-btn" id="betTailsBtn" onclick="selectBet('tails')">⭐ 裏に賭ける</button>
    </div>
    <div class="bet-amount-row">
      <span class="bet-amount-label">賭け額</span>
      <div class="bet-presets">
        <button class="bet-preset-btn" onclick="setBetAmount(10)">10</button>
        <button class="bet-preset-btn" onclick="setBetAmount(50)">50</button>
        <button class="bet-preset-btn" onclick="setBetAmount(100)">100</button>
        <button class="bet-preset-btn" onclick="setBetAmount(500)">500</button>
        <button class="bet-preset-btn" id="betAllBtn" onclick="setBetAll()">ALL</button>
      </div>
    </div>
    <div class="bet-result-msg" id="betResultMsg"></div>
  </div>

  <button class="toss-btn" id="tossBtn" onclick="toss()">🪙 トス！</button>

  <!-- Bottom: prob + history -->
  <div class="bottom-card">
    <div class="prob-row">
      <div class="prob-label" style="color:#FFD700">表</div>
      <div class="prob-bar"><div class="prob-fill-heads" id="headsBar"></div></div>
      <div class="prob-pct" id="headsPct">-</div>
      <div class="prob-label" style="margin-left:6px">裏</div>
      <div class="prob-bar"><div class="prob-fill-tails" id="tailsBar"></div></div>
      <div class="prob-pct" id="tailsPct">-</div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

    function playFlipSound() {
      const ctx = getAudioCtx(), now = ctx.currentTime;
      for (let i = 0; i < 6; i++) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(400 + Math.random()*800, now + i*0.05);
        osc.frequency.exponentialRampToValueAtTime(100 + Math.random()*200, now + i*0.05 + 0.08);
        gain.gain.setValueAtTime(0.06, now + i*0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.05 + 0.1);
        osc.start(now + i*0.05); osc.stop(now + i*0.05 + 0.15);
      }
    }

    function playResultSound(isHeads) {
      const ctx = getAudioCtx(), now = ctx.currentTime;
      if (isHeads) {
        [523,659,784,1047].forEach((freq,i) => {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i*0.1);
          gain.gain.setValueAtTime(0.15, now + i*0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.25);
          osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.3);
        });
      } else {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now); osc.stop(now + 0.5);
      }
    }

    function playWinSound() {
      const ctx = getAudioCtx(), now = ctx.currentTime;
      [523,659,784,1047,1319].forEach((freq,i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i*0.08);
        gain.gain.setValueAtTime(0.18, now + i*0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.3);
        osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.35);
      });
    }

    function playLoseSound() {
      const ctx = getAudioCtx(), now = ctx.currentTime;
      [300,220,150].forEach((freq,i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + i*0.12);
        gain.gain.setValueAtTime(0.12, now + i*0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.12 + 0.2);
        osc.start(now + i*0.12); osc.stop(now + i*0.12 + 0.25);
      });
    }

    // State
    let total = 0, heads = 0, tails = 0;
    let history = [];
    let isFlipping = false;
    let wallet = 1000, betChoice = null, betAmount = 0;

    function selectBet(choice) {
      betChoice = choice;
      document.getElementById('betHeadsBtn').classList.toggle('selected', choice === 'heads');
      document.getElementById('betTailsBtn').classList.toggle('selected', choice === 'tails');
    }

    function setBetAmount(amount) {
      betAmount = Math.min(amount, wallet);
      document.querySelectorAll('.bet-preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent == amount);
      });
    }

    function setBetAll() {
      betAmount = wallet;
      document.querySelectorAll('.bet-preset-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('betAllBtn').classList.add('active');
    }

    function updateWallet() {
      document.getElementById('walletValue').textContent = wallet;
    }

    function toss() {
      if (isFlipping) return;
      isFlipping = true;
      const btn = document.getElementById('tossBtn');
      const wrapper = document.getElementById('coinWrapper');
      const resultText = document.getElementById('resultText');
      const resultSub = document.getElementById('resultSub');

      btn.disabled = true;
      resultText.classList.remove('show','heads-result','tails-result');
      resultSub.classList.remove('show');

      playFlipSound();

      const isHeads = Math.random() < 0.5;
      const finalRotation = isHeads ? 4*360 : 4*360 + 180;
      wrapper.style.setProperty('--final-rotation', `${finalRotation}deg`);
      wrapper.classList.remove('flipping');
      void wrapper.offsetWidth;
      wrapper.classList.add('flipping');

      setTimeout(() => {
        total++; if (isHeads) heads++; else tails++;

        resultText.textContent = isHeads ? '🌟 HEADS！' : '💫 TAILS！';
        resultText.classList.add('show', isHeads ? 'heads-result' : 'tails-result');
        const streak = calcStreak(isHeads);
        resultSub.textContent = streak > 1 ? `${streak}連続 ${isHeads?'表':'裏'}！` : '';
        resultSub.classList.add('show');

        const betMsg = document.getElementById('betResultMsg');
        betMsg.classList.remove('show','win','lose');

        if (betChoice && betAmount > 0) {
          const won = (betChoice === 'heads') === isHeads;
          if (won) {
            wallet += betAmount;
            betMsg.textContent = `🎉 +${betAmount} 獲得！`;
            betMsg.classList.add('show','win');
            playWinSound();
            spawnParticles(['#FFD700','#FF6B6B','#FF9F43','#FFF','#FFD700']);
          } else {
            wallet -= betAmount;
            betMsg.textContent = `💸 -${betAmount} 残念！`;
            betMsg.classList.add('show','lose');
            playLoseSound();
            spawnParticles(['#aaa','#666','#74ebd5']);
          }
          updateWallet();
          betAmount = 0;
          document.querySelectorAll('.bet-preset-btn').forEach(b => b.classList.remove('active'));
          if (wallet <= 0) {
            wallet = 0; updateWallet();
            setTimeout(() => showModal(), 600);
          }
        } else {
          playResultSound(isHeads);
          spawnParticles(isHeads ? ['#FFD700','#FF6B6B','#FF9F43','#FFF'] : ['#ddd','#aaa','#74ebd5','#fff']);
        }

        updateStats();
        addHistory(isHeads);
        wrapper.classList.remove('flipping');
        wrapper.style.transform = `rotateY(${isHeads ? 0 : 180}deg)`;
        btn.disabled = false;
        isFlipping = false;
      }, 1050);
    }

    function calcStreak(isHeads) {
      let count = 1;
      for (let i = history.length-1; i >= 0; i--) {
        if (history[i] === isHeads) count++; else break;
      }
      return count;
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = total;
      document.getElementById('headsCount').textContent = heads;
      document.getElementById('tailsCount').textContent = tails;
      if (total > 0) {
        const hp = Math.round(heads/total*100), tp = 100-hp;
        document.getElementById('headsBar').style.width = hp+'%';
        document.getElementById('tailsBar').style.width = tp+'%';
        document.getElementById('headsPct').textContent = hp+'%';
        document.getElementById('tailsPct').textContent = tp+'%';
      }
    }

    function addHistory(isHeads) {
      history.push(isHeads);
      if (history.length > 20) history.shift();
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      history.slice().reverse().forEach(h => {
        const item = document.createElement('div');
        item.className = 'history-item ' + (h ? 'h' : 't');
        item.textContent = h ? '😊' : '⭐';
        list.appendChild(item);
      });
    }

    function spawnParticles(colors) {
      const container = document.getElementById('particles');
      const cx = window.innerWidth/2, cy = window.innerHeight/2;
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random()*2*Math.PI;
        const dist = 70 + Math.random()*130;
        p.style.left = cx+'px'; p.style.top = cy+'px';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        p.style.setProperty('--dy', Math.sin(angle)*dist-70+'px');
        const sz = (5 + Math.random()*7)+'px';
        p.style.width = sz; p.style.height = sz;
        container.appendChild(p);
        setTimeout(() => p.remove(), 900);
      }
    }

    function showModal() {
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal(reset) {
      document.getElementById('modalOverlay').classList.remove('show');
      if (reset) { wallet = 1000; updateWallet(); }
    }

    document.getElementById('coinScene').addEventListener('click', toss);
  </script>
</body>
</html>
