<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>たいじゅうノート</title>
  <meta name="description" content="やさしく続けられる体重記録アプリ" />
  <meta name="theme-color" content="#4caf82" id="meta-theme-color" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="たいじゅうノート" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ナビゲーション -->
  <nav class="nav">
    <div class="nav-inner">
      <span class="nav-title">たいじゅうノート</span>
      <div class="nav-actions">
        <button class="btn-icon" id="btn-theme" aria-label="テーマ切替">🌙</button>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="home">ホーム</button>
      <button class="tab-btn" data-tab="graph">グラフ</button>
      <button class="tab-btn" data-tab="history">記録</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </div>
  </nav>

  <main class="main">
    <!-- ホームタブ -->
    <section class="tab-content active" id="tab-home">
      <!-- 今日の入力カード -->
      <div class="card card-input">
        <div class="card-label" id="today-label">今日の体重</div>

        <!-- 体重表示 (タップで直接入力) -->
        <div class="weight-display-wrap">
          <input
            type="number"
            id="weight-input"
            class="weight-display"
            step="0.1"
            min="20"
            max="300"
            inputmode="decimal"
            aria-label="体重（kg）"
          />
          <span class="weight-unit">kg</span>
        </div>

        <!-- 前回比 -->
        <div class="weight-diff" id="weight-diff"></div>

        <!-- 増減ボタン -->
        <div class="adjust-btns">
          <button class="adj-btn adj-minus-lg" data-delta="-0.5" aria-label="-0.5kg">－0.5</button>
          <button class="adj-btn adj-minus-sm" data-delta="-0.1" aria-label="-0.1kg">－0.1</button>
          <button class="adj-btn adj-plus-sm" data-delta="+0.1" aria-label="+0.1kg">＋0.1</button>
          <button class="adj-btn adj-plus-lg" data-delta="+0.5" aria-label="+0.5kg">＋0.5</button>
        </div>

        <!-- メモ -->
        <div class="memo-wrap">
          <input type="text" id="memo-input" class="memo-input" placeholder="ひとことメモ（任意）" maxlength="50" />
        </div>

        <!-- 保存ボタン -->
        <button class="btn-save" id="btn-save">今日の体重を記録する</button>

        <!-- やさしいメッセージ -->
        <div class="gentle-message" id="gentle-message"></div>
      </div>

      <!-- サマリーカード -->
      <div class="cards-row">
        <div class="card card-stat">
          <div class="stat-label">7日平均</div>
          <div class="stat-value" id="avg7">—</div>
          <div class="stat-unit">kg</div>
        </div>
        <div class="card card-stat">
          <div class="stat-label">連続記録</div>
          <div class="stat-value" id="streak">0</div>
          <div class="stat-unit">日</div>
        </div>
        <div class="card card-stat">
          <div class="stat-label">目標まで</div>
          <div class="stat-value" id="goal-diff">—</div>
          <div class="stat-unit" id="goal-diff-unit">kg</div>
        </div>
      </div>

      <!-- ミニグラフ -->
      <div class="card card-minigraph">
        <div class="card-header-row">
          <span class="card-header-label">直近14日の推移</span>
        </div>
        <canvas id="mini-chart" height="120"></canvas>
      </div>

      <!-- 週間ふり返り -->
      <div class="card card-weekly">
        <div class="card-header-label">今週のふり返り</div>
        <div class="weekly-grid" id="weekly-summary"></div>
      </div>

      <!-- カレンダー -->
      <div class="card card-calendar">
        <div class="card-header-row">
          <button class="btn-icon-sm" id="cal-prev">‹</button>
          <span class="card-header-label" id="cal-title"></span>
          <button class="btn-icon-sm" id="cal-next">›</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </section>

    <!-- グラフタブ -->
    <section class="tab-content" id="tab-graph">
      <div class="card">
        <div class="graph-range-btns">
          <button class="range-btn active" data-range="7">7日</button>
          <button class="range-btn" data-range="30">30日</button>
          <button class="range-btn" data-range="90">90日</button>
          <button class="range-btn" data-range="0">全期間</button>
        </div>
        <canvas id="main-chart" height="240"></canvas>
        <div class="chart-legend">
          <span class="legend-dot legend-dot-avg"></span>7日移動平均
          <span class="legend-dot legend-dot-raw" style="margin-left:12px"></span>実測値
        </div>
      </div>

      <!-- 統計サマリー -->
      <div class="card">
        <div class="card-header-label">期間の統計</div>
        <div class="stats-grid" id="stats-grid"></div>
      </div>
    </section>

    <!-- 記録タブ -->
    <section class="tab-content" id="tab-history">
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="history-list" id="history-list"></div>
        <div class="history-empty" id="history-empty" style="display:none;">記録がまだありません</div>
      </div>
    </section>

    <!-- 設定タブ -->
    <section class="tab-content" id="tab-settings">
      <div class="card">
        <div class="setting-label">目標体重（kg）</div>
        <div class="setting-row">
          <input type="number" id="goal-input" class="setting-input" step="0.1" min="20" max="300" placeholder="例：65.0" inputmode="decimal" />
          <button class="btn-small" id="btn-save-goal">保存</button>
        </div>
      </div>

      <div class="card">
        <div class="setting-label">身長（cm）</div>
        <div class="setting-row">
          <input type="number" id="height-input" class="setting-input" step="0.1" min="100" max="250" placeholder="例：170.0" inputmode="decimal" />
          <button class="btn-small" id="btn-save-height">保存</button>
        </div>
        <div class="bmi-info" id="bmi-info"></div>
      </div>

      <div class="card">
        <div class="setting-label">データ管理</div>
        <div class="data-btns">
          <button class="btn-outline" id="btn-export">CSVエクスポート</button>
          <label class="btn-outline" for="csv-import">CSVインポート</label>
          <input type="file" id="csv-import" accept=".csv" style="display:none" />
        </div>
      </div>

      <div class="card card-danger">
        <div class="setting-label">危険ゾーン</div>
        <button class="btn-danger" id="btn-clear-all">すべての記録を削除</button>
      </div>
    </section>
  </main>

  <!-- 編集モーダル -->
  <div class="modal-overlay" id="edit-modal" style="display:none;">
    <div class="modal">
      <h3 class="modal-title">記録を編集</h3>
      <input type="hidden" id="edit-id" />
      <div class="modal-field">
        <label>日付</label>
        <input type="date" id="edit-date" class="setting-input" />
      </div>
      <div class="modal-field">
        <label>体重（kg）</label>
        <input type="number" id="edit-weight" class="setting-input" step="0.1" min="20" max="300" inputmode="decimal" />
      </div>
      <div class="modal-field">
        <label>メモ</label>
        <input type="text" id="edit-memo" class="setting-input" maxlength="50" />
      </div>
      <div class="modal-actions">
        <button class="btn-outline" id="btn-edit-cancel">キャンセル</button>
        <button class="btn-save" id="btn-edit-save">保存</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
